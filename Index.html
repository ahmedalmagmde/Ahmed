<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محوّل الملفات | Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Share+Tech+Mono&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#020503;--brown:#07140b;--brown2:#0a2415;--bronze:#00ff7f;--sand:#d4ffe4;--mute:#5fae82;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,var(--brown2),var(--bg) 62%);color:var(--sand);font-family:'Tajawal','Cormorant Garamond',system-ui,sans-serif;overflow-x:hidden}
.glow{position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(185,138,90,.22),transparent 65%);top:-160px;left:50%;margin-left:-260px;animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(120px,60px)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;max-width:560px;margin:0 auto;padding:22px 20px 44px}
.top{display:flex;justify-content:space-between;align-items:center}
.mark{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;letter-spacing:.32em;color:var(--bronze)}
.lang{background:none;border:1px solid var(--bronze);color:var(--sand);border-radius:99px;padding:6px 16px;font:inherit;cursor:pointer;transition:.25s}
.lang:hover{background:var(--bronze);color:var(--bg)}
h1{font-family:'Amiri','Cormorant Garamond',serif;font-weight:700;font-size:clamp(38px,11vw,58px);line-height:1.2;margin:54px 0 10px;text-align:center;background:linear-gradient(100deg,#8a5d38 10%,#f0dcb9 45%,#b98a5a 60%,#8a5d38 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite alternate}
@keyframes shine{to{background-position:-120% 0}}
.sub{text-align:center;color:var(--mute);margin:0 0 30px;font-size:17px}
.rule{height:1px;margin:0 auto 30px;width:120px;background:linear-gradient(90deg,transparent,var(--bronze),transparent)}
.drop{border:1px solid rgba(185,138,90,.55);border-radius:6px;padding:40px 18px;text-align:center;background:linear-gradient(160deg,rgba(74,44,25,.45),rgba(10,7,6,.6));cursor:pointer;transition:.35s}
.drop:hover,.drop.on{border-color:var(--sand);box-shadow:0 0 40px rgba(185,138,90,.25),inset 0 0 30px rgba(185,138,90,.08)}
.drop b{display:block;font-family:'Amiri','Cormorant Garamond',serif;font-size:24px;font-weight:400}
.drop small{color:var(--mute)}
.fname{margin:18px 0 0;text-align:center;color:var(--bronze);word-break:break-all;min-height:22px}
.row{display:none;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px}
.row.show{display:flex}
select,.go{font:inherit;color:var(--sand);border-radius:4px;padding:12px 20px}
select{background:var(--brown);border:1px solid var(--bronze)}
.go{background:linear-gradient(135deg,#c79a68,#8a5d38);border:0;color:#120a05;font-weight:500;cursor:pointer;transition:.25s;letter-spacing:.04em}
.go:hover{filter:brightness(1.12);transform:translateY(-1px)}
.go:disabled{opacity:.5}
.go:focus-visible,select:focus-visible,.drop:focus-visible,.lang:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
.bar{display:none;height:3px;margin:24px 0 0;background:rgba(232,217,196,.12);overflow:hidden}
.bar.show{display:block}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a5d38,#f0dcb9);transition:width .3s}
.msg{margin-top:14px;min-height:22px;text-align:center;color:var(--mute)}
.done{display:none;text-align:center;margin-top:12px}
.done.show{display:block}
.ring{width:64px;height:64px;margin:0 auto 10px;border:1px solid var(--bronze);border-radius:50%;display:grid;place-items:center;color:var(--bronze);font-size:28px;animation:ring .9s ease-out}
@keyframes ring{from{transform:scale(.3);opacity:0;box-shadow:0 0 0 0 rgba(185,138,90,.7)}to{transform:scale(1);opacity:1;box-shadow:0 0 0 28px rgba(185,138,90,0)}}
.done h2{font-family:'Amiri','Cormorant Garamond',serif;font-weight:400;font-size:26px;margin:0 0 10px}
.done a{display:inline-block;border:1px solid var(--bronze);color:var(--sand);text-decoration:none;padding:12px 28px;border-radius:4px;transition:.25s}
.done a:hover{background:var(--bronze);color:var(--bg)}
.note{margin-top:34px;font-size:13px;color:var(--mute);text-align:center;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.glow{background:radial-gradient(circle,rgba(0,255,127,.14),transparent 65%)}
#mx{opacity:.55}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.mark,h1,.drop b,.done h2{font-family:'Share Tech Mono','Amiri',monospace}
h1{background-image:linear-gradient(100deg,#00a85a 10%,#c8ffe0 45%,#00ff7f 60%,#00a85a 90%)}
.drop{border-color:rgba(0,255,127,.5);background:rgba(2,12,6,.72)}
.drop:hover,.drop.on{border-color:#00ff7f;box-shadow:0 0 34px rgba(0,255,127,.35),inset 0 0 26px rgba(0,255,127,.08)}
.go{background:linear-gradient(135deg,#00ff7f,#00a85a);color:#001a0c}
.bar i{background:linear-gradient(90deg,#00a85a,#c8ffe0)}
.ring{animation-name:ring2}
@keyframes ring2{from{transform:scale(.3);opacity:0;box-shadow:0 0 0 0 rgba(0,255,127,.7)}to{transform:scale(1);opacity:1;box-shadow:0 0 0 28px rgba(0,255,127,0)}}
</style>
</head>
<body>
<div class="glow"></div>
<canvas id="mx" aria-hidden="true"></canvas><canvas id="sk" aria-hidden="true"></canvas>
<main>
  <div class="top"><span class="mark">AHMED ASIRI</span><button class="lang" id="lang">English</button></div>
  <h1 data-i="title"></h1>
  <p class="sub" data-i="sub"></p>
  <div class="rule"></div>

  <div class="drop" id="drop" tabindex="0" role="button">
    <b data-i="drop"></b>
    <small data-i="types"></small>
    <input id="inp" type="file" hidden accept=".docx,.txt,.md,.html,.htm,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg">
  </div>
  <div class="fname" id="fname"></div>
  <div class="row" id="row">
    <select id="fmt" aria-label="format"></select>
    <button class="go" id="go" data-i="go"></button>
  </div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="msg" id="msg"></div>
  <div class="done" id="done"><div class="ring">✓</div><h2 data-i="done"></h2><a id="dl" href="#" data-i="dl"></a></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const T={
ar:{title:'حوّل ملفاتك بأناقة',sub:'سريع وآمن، والتحويل يتم على جهازك',drop:'اسحب الملف هنا أو اضغط للاختيار',types:'Word · نص · HTML · صور',go:'حوّل الآن',done:'تم التحويل',dl:'تحميل الملف',busy:'جاري التحويل…',err:'تعذّر التحويل، جرّب ملفاً آخر',bad:'هذه الصيغة غير مدعومة، جرّب Word أو نص أو صورة',note:'ملفات Word القديمة (.doc) احفظها بصيغة .docx أولاً. تحويل PDF وExcel وPowerPoint يحتاج خادماً.',btn:'English'},
en:{title:'Convert your files, elegantly',sub:'Fast and private. Everything runs on your device.',drop:'Drop a file here or tap to choose',types:'Word · Text · HTML · Images',go:'Convert',done:'Conversion complete',dl:'Download file',busy:'Converting…',err:'Conversion failed. Try another file.',bad:'This format is not supported. Try Word, text or an image.',note:'Save old Word files (.doc) as .docx first. PDF, Excel and PowerPoint input needs a server.',btn:'العربية'}
};
let L='ar',state='';
function render(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[L][e.dataset.i]);
  $('#lang').textContent=T[L].btn;
  if(state)$('#msg').textContent=T[L][state];
}
$('#lang').onclick=()=>{L=L==='ar'?'en':'ar';render()};

const IMG=['png','jpg','jpeg','webp','gif','bmp','svg'];
const MAP={docx:['pdf','html','txt'],txt:['pdf','html'],md:['pdf','html'],html:['pdf','txt'],htm:['pdf','txt']};
IMG.forEach(e=>MAP[e]=['pdf','png','jpg','webp'].filter(x=>x!==(e==='jpeg'?'jpg':e)));
let file=null,url=null;
const ext=n=>n.split('.').pop().toLowerCase();
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const say=k=>{state=k;$('#msg').textContent=k?T[L][k]:''};

const drop=$('#drop'),inp=$('#inp');
drop.onclick=()=>inp.click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}};
inp.onchange=()=>pick(inp.files[0]);
['dragover','dragenter'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>pick(e.dataTransfer.files[0]));

function pick(f){
  if(!f)return;
  $('#done').classList.remove('show');say('');
  const e=ext(f.name);
  if(!MAP[e]){file=null;$('#row').classList.remove('show');$('#fname').textContent='';say('bad');return}
  file=f;$('#fname').textContent=f.name;
  $('#fmt').innerHTML=MAP[e].map(x=>`<option value="${x}">${x.toUpperCase()}</option>`).join('');
  $('#row').classList.add('show');
}
function progress(){
  let p=0;const fill=$('#fill');$('#bar').classList.add('show');
  const t=setInterval(()=>{p+=(90-p)*.08;fill.style.width=p+'%'},120);
  return ()=>{clearInterval(t);fill.style.width='100%'};
}
async function toPdf(html){
  const d=document.createElement('div');
  d.style.cssText='position:absolute;left:-9999px;top:0;width:700px;padding:20px;background:#fff;color:#000;font:15px/1.7 Tajawal,Arial,sans-serif';
  d.setAttribute('dir','auto');d.innerHTML=html;document.body.appendChild(d);
  try{return await html2pdf().set({margin:10,html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4'}}).from(d).outputPdf('blob')}
  finally{d.remove()}
}
const loadImg=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
async function convert(f,to){
  const e=ext(f.name);
  if(e==='docx'){
    const buf=await f.arrayBuffer();
    if(to==='txt')return new Blob([(await mammoth.extractRawText({arrayBuffer:buf})).value],{type:'text/plain'});
    const html=(await mammoth.convertToHtml({arrayBuffer:buf})).value;
    if(to==='html')return new Blob(['<meta charset="utf-8"><body dir="auto">'+html],{type:'text/html'});
    return toPdf(html);
  }
  if(['txt','md'].includes(e)){
    const t=await f.text();
    if(to==='html')return new Blob(['<meta charset="utf-8"><body dir="auto"><pre style="white-space:pre-wrap;font:16px/1.7 sans-serif">'+esc(t)+'</pre>'],{type:'text/html'});
    return toPdf('<div style="white-space:pre-wrap">'+esc(t)+'</div>');
  }
  if(['html','htm'].includes(e)){
    const t=await f.text();
    if(to==='txt'){const x=new DOMParser().parseFromString(t,'text/html');return new Blob([x.body.innerText||x.body.textContent],{type:'text/plain'})}
    return toPdf(t);
  }
  const img=await loadImg(f);
  const c=document.createElement('canvas');c.width=img.naturalWidth||800;c.height=img.naturalHeight||600;
  const x=c.getContext('2d');
  if(to==='pdf'||to==='jpg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  x.drawImage(img,0,0);
  if(to==='pdf')return toPdf('<img src="'+c.toDataURL('image/jpeg',.92)+'" style="max-width:100%">');
  return new Promise(r=>c.toBlob(r,to==='jpg'?'image/jpeg':'image/'+to,.92));
}
$('#go').onclick=async()=>{
  if(!file)return;
  const to=$('#fmt').value,btn=$('#go');
  btn.disabled=true;$('#done').classList.remove('show');say('busy');
  const finish=progress();
  try{
    const blob=await convert(file,to);
    finish();
    if(url)URL.revokeObjectURL(url);
    url=URL.createObjectURL(blob);
    const a=$('#dl');a.href=url;a.download=file.name.replace(/\.[^.]+$/,'')+'.'+to;
    say('');
    const d=$('#done');d.classList.remove('show');void d.offsetWidth;d.classList.add('show');
  }catch(err){finish();say('err')}
  btn.disabled=false;
  setTimeout(()=>{$('#bar').classList.remove('show');$('#fill').style.width='0'},900);
};

/* drifting bronze dust */
const cv=$('#sk'),cx=cv.getContext('2d');let W,H;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',size);size();
const mk=()=>({x:Math.random()*W,y:H+10,r:.6+Math.random()*1.6,s:.15+Math.random()*.4,a:Math.random()*6,o:.15+Math.random()*.4});
const P=Array.from({length:0},()=>{const p=mk();p.y=Math.random()*H;return p});
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function loop(){
  cx.clearRect(0,0,W,H);
  P.forEach(p=>{
    p.a+=.01;p.y-=p.s;p.x+=Math.sin(p.a)*.3;
    if(p.y<-10)Object.assign(p,mk());
    cx.globalAlpha=p.o;cx.fillStyle='#d9b68a';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill();
  });
  if(!still)requestAnimationFrame(loop);
})();
const mc=$('#mx'),mx=mc.getContext('2d'),fs=16;let cols,drops;
function msz(){mc.width=innerWidth;mc.height=innerHeight;cols=Math.ceil(innerWidth/fs);drops=Array.from({length:cols},()=>Math.random()*-60)}
addEventListener('resize',msz);msz();
const chars='01アイウエオカキクケコサシスセソ{}[]<>/$#%&*ABCDEF'.split('');
(function rain(){
  mx.fillStyle='rgba(2,5,3,.09)';mx.fillRect(0,0,mc.width,mc.height);
  mx.font=fs+'px monospace';
  for(let i=0;i<cols;i++){
    const y=drops[i]*fs;
    mx.fillStyle=Math.random()<.04?'#d4ffe4':'#00ff7f';
    mx.fillText(chars[Math.random()*chars.length|0],i*fs,y);
    if(y>mc.height&&Math.random()>.975)drops[i]=0;
    drops[i]+=.6;
  }
  if(!still)requestAnimationFrame(rain);
})();
render();
</script>
</body>
</html>
